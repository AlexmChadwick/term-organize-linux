[package]
name = "term-organize-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local MCP server for the Term Organize catalogs and degree plans"
publish = false

[[bin]]
name = "term-organize-mcp"
path = "src/main.rs"

[dependencies]
termorganize-core = { path = "../core" }
rmcp = { version = "3.6", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }
